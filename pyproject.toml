[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-cbir"
version = "0.1.0"
description = "Lightweight multi-level DINOv2 embeddings for image retrieval"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "Pillow>=10.0",
    "h5py>=3.9",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
