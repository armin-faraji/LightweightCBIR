[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-cbir"
version = "0.1.0"
description = "Lightweight multi-level DINOv2 embeddings for image retrieval"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.12",
    "torchvision>=0.27",
    "numpy>=2.5",
    "Pillow>=12.0",
    "h5py>=3.16",
    "scipy>=1.18",
    "PyYAML>=6.0",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "ipykernel>=7.0",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
